name: Verifikasi Serviam HRD
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-serviam-isolated-database
          POSTGRES_DB: serviam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d serviam_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
        env:
          NODE_ENV: test
          BOOTSTRAP_ACCOUNTS: 'false'
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-serviam-isolated-database@127.0.0.1:5432/serviam_test
      - run: npm run vercel:check
      - run: docker build -t serviam-hrd-ci .
