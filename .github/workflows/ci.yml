name: Verifikasi Serviam HRD
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
        env:
          NODE_ENV: test
          BOOTSTRAP_ACCOUNTS: 'false'
      - run: docker build -t serviam-hrd-ci .
