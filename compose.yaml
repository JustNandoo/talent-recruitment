services:
  app:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      APP_ORIGIN: https://${APP_DOMAIN:?Isi APP_DOMAIN pada .env}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      BOOTSTRAP_ACCOUNTS: "false"
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@serviam.local}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@serviam.local}
    volumes:
      - exam_data:/app/.data
  proxy:
    image: caddy:2@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Isi APP_DOMAIN pada .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  exam_data:
  caddy_data:
  caddy_config:
